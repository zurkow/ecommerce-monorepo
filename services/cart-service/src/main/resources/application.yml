server:
  port: 8082

spring:
  application:
    name: cart-service
  datasource:
    # Each service owns its OWN in-memory database (database-per-service pattern).
    url: jdbc:h2:mem:cartdb;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true   # http://localhost:8082/h2-console  (JDBC URL: jdbc:h2:mem:cartdb)

management:
  endpoints:
    web:
      exposure:
        include: health,info
