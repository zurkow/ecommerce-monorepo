server:
  port: 8084

spring:
  application:
    name: payment-service
  datasource:
    # Each service owns its OWN in-memory database (database-per-service pattern).
    url: jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true   # http://localhost:8084/h2-console  (JDBC URL: jdbc:h2:mem:paymentdb)

management:
  endpoints:
    web:
      exposure:
        include: health,info

payment:
  limit: 1000   # payments above this amount are DECLINED (demo rule)
